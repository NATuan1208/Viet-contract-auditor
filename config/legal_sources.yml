version: 1
policy:
  canonical_mode: official_first
  commercial_sources: discovery_only
  default_schedule: daily_batch
  provenance_required: true
  source_attribution_required: true
lakehouse:
  catalog:
    type: sql
    uri: postgresql+psycopg2://rag:rag_secure_pwd@postgres:5432/viet_contract
    warehouse: s3://legal-lakehouse/warehouse
  object_store:
    endpoint: http://minio:9000
    bucket: legal-lakehouse
    access_key_env: MINIO_ROOT_USER
    secret_key_env: MINIO_ROOT_PASSWORD
  layers:
    bronze: raw response bodies, headers, checksums, and fetch metadata
    silver: normalized legal documents with article structure and provenance
    gold: chunks, relations, entity seeds, and KG update manifests
sources:
  - source_id: congbao
    name: Cong bao dien tu Chinh phu
    tier: 0
    role: canonical_update_feed
    base_url: https://congbao.chinhphu.vn
    domain_whitelist:
      - congbao.chinhphu.vn
      - congbao.dev.cnnd.vn
    crawl_methods:
      - rss
      - detail
    rss_feeds:
      - id: van_ban_moi_dang
        url: https://congbao.chinhphu.vn/cac-van-ban-moi-ban-hanh.rss
      - id: cong_bao_moi_dang
        url: http://congbao.chinhphu.vn/cac-so-cong-bao-moi-dang.rss
    rate_limit_per_minute: 30
    robots_policy: obey
    priority: 10
    license_note: "Canonical official source; RSS pages require source attribution."

  - source_id: vbpl
    name: Co so du lieu quoc gia ve VBQPPL
    tier: 0
    role: canonical_fulltext
    base_url: https://vbpl.vn
    domain_whitelist:
